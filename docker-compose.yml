services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lensproof_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lensproof
      POSTGRES_PASSWORD: lensproof_dev_password
      POSTGRES_DB: lensproof
    ports:
      - "5432:5432"
    volumes:
      - lensproof_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  lensproof_pgdata:
